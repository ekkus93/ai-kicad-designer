name: M2h2 Final Qualification

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2h2-final-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  final-qualification:
    name: 56 positives x5 plus V3-8 negative on locked runner
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[m2h2-final-qualification]')
    runs-on: self-hosted
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Report locked KiCad toolchain identity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import platform
          import subprocess

          def digest(path: Path) -> str | None:
              if not path.is_file():
                  return None
              return hashlib.sha256(path.read_bytes()).hexdigest()

          cpu_model = next(
              (
                  line.split(':', 1)[1].strip()
                  for line in Path('/proc/cpuinfo').read_text().splitlines()
                  if line.startswith('model name')
              ),
              None,
          )
          lock = json.loads(Path('fixtures/m1a/toolchain.lock.json').read_text())
          report = {
              'platform': {
                  'os': platform.platform(),
                  'architecture': platform.machine(),
                  'cpu': platform.processor() or platform.machine(),
                  'cpu_model': cpu_model,
              },
              'executables': [],
              'libraries': [],
          }
          for section in ('executables', 'libraries'):
              for item in lock[section]:
                  path = Path(item['path'])
                  report[section].append(
                      {
                          'id': item['id'],
                          'path': str(path),
                          'exists': path.is_file(),
                          'expected_sha256': item.get('file_sha256'),
                          'actual_sha256': digest(path),
                          'version': item.get('version'),
                      }
                  )
          launcher = Path(lock['executables'][0]['path'])
          if launcher.is_file():
              probe = subprocess.run(
                  [str(launcher), 'kicad-cli', 'version'],
                  capture_output=True,
                  text=True,
                  timeout=30,
              )
              report['version_probe'] = {
                  'returncode': probe.returncode,
                  'stdout': probe.stdout.strip(),
                  'stderr': probe.stderr.strip(),
              }
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Run final 56-positive qualification
        run: >-
          PYTHONPATH=src:tools python tools/run_m2h2_qualification.py
          --out fixtures/m2h2/qualification_final_candidate_${{ github.sha }}

      - name: Upload final qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2h2-final-qualification-${{ github.sha }}
          path: fixtures/m2h2/qualification_final_candidate_${{ github.sha }}
          if-no-files-found: warn
