name: M2h2 Base Render Audit

on:
  workflow_run:
    workflows: [M2h2 Final Qualification]
    types: [completed]
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source_head:
        description: Exact qualified source SHA with persisted runner evidence
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[m2h2-base-render-audit]')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Resolve exact qualified source
        id: evidence
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_HEAD: ${{ inputs.source_head }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            source_sha="$EVENT_HEAD"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            source_sha="$DISPATCH_HEAD"
          elif [[ "$PUSH_MESSAGE" =~ \[m2h2-audit-source:([0-9a-f]{40})\] ]]; then
            source_sha="${BASH_REMATCH[1]}"
          else
            echo "Push audit requires an explicit m2h2-audit-source SHA" >&2
            exit 1
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          test -f "$HOME/m2h2-evidence/$source_sha/qualification/results.json"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.evidence.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Transfer source-matched base renders and inspection metadata
        env:
          QUALIFICATION_HEAD: ${{ steps.evidence.outputs.source_sha }}
        run: |
          PYTHONPATH=src:tools python - <<'PY'
          import json
          import os
          from pathlib import Path
          from run_m2h2_final_artifact_audit import identity_errors, render_chunks
          sha = os.environ['QUALIFICATION_HEAD']
          root = Path.home() / 'm2h2-evidence' / sha / 'qualification'
          payload = json.loads((root / 'results.json').read_text())
          errors = identity_errors(payload)
          assert not errors, errors
          assert payload['git_head'] == sha
          assert payload['accepted'] == payload['total'] == 56
          assert payload['negative_v3_8_accepted'] is True
          for case in payload['results']:
              assert case['accepted'] and case['reproducible'] and len(case['runs']) == 5
              signature = case['signature']
              composition = signature['composition']
              print(json.dumps({
                  'kind': 'm2h2.base-render-audit.1',
                  'case': case['id'],
                  'source_head': payload['git_head'],
                  'source_sha256': payload['source_sha256'],
                  'layout': signature['layout'],
                  'blocks': composition['blocks'],
                  'variants': composition['variants'],
                  'runs': [run['path'] for run in case['runs']],
              }, separators=(',', ':')), flush=True)
              render_chunks(root, 'base__' + case['id'], root / case['id'])
          PY
