name: M2h2 Final Interactions

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2h2-final-interactions-${{ github.ref }}
  # Supersede obsolete-source runs explicitly; report-only pushes preserve active qualification.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[m2h2-supersede-qualification]') || contains(github.event.head_commit.message, '[m2h2-interaction-qualification]') }}

jobs:
  final-interactions:
    name: I1-I6 five-run locked-KiCad qualification
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[m2h2-interaction-qualification]')
    runs-on: self-hosted
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run final I1-I6 interaction qualification
        run: |
          set -uo pipefail
          export PYTHONPATH=src:tools
          root="fixtures/m2h2/interaction_final_${GITHUB_SHA}"
          overall=0
          for group in i1 i2 i3 i4 i5 i6; do
            if ! python tools/run_m2h2_i1.py \
              --group "$group" \
              --out "$root/$group"; then
              overall=1
            fi
            echo "===== $group compact results ====="
            GROUP="$group" ROOT="$root" python - <<'PY'
          import json
          import os
          from pathlib import Path

          group = os.environ["GROUP"]
          root = Path(os.environ["ROOT"])
          payload = json.loads((root / group / "results.json").read_text())
          summary = {
              "group": group,
              "accepted": payload["accepted"],
              "total": payload["total"],
              "cases": [],
          }
          for case in payload["results"]:
              item = {
                  "id": case["id"],
                  "cell": case.get("cell"),
                  "selected_triple": case.get("selected_triple"),
                  "accepted": case["accepted"],
                  "reproducible": case["reproducible"],
                  "observed_structural_class_stable": case.get(
                      "observed_structural_class_stable"
                  ),
              }
              if not case["accepted"]:
                  item["runs"] = [
                      {
                          "run": run["run"],
                          "returncode": run["returncode"],
                          "pass": run.get("pass"),
                          "partition_match": run.get("partition_match"),
                          "terminal_match": run.get("terminal_match"),
                          "failed_paths": [
                              path["id"] for path in run.get("paths", []) if not path["pass"]
                          ],
                          "failed_precedence": [
                              [edge["source"], edge["target"]]
                              for edge in run.get("precedence", [])
                              if not edge["pass"]
                          ],
                          "failure_class": run.get("failure", {}).get("failure_class"),
                          "diagnostic": run.get("failure", {}).get("diagnostic"),
                      }
                      for run in case["runs"]
                  ]
              summary["cases"].append(item)
          print(json.dumps(summary, separators=(",", ":")))
          PY
          done
          exit "$overall"

      - name: Upload final interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2h2-final-interactions-${{ github.sha }}
          path: fixtures/m2h2/interaction_final_${{ github.sha }}
          if-no-files-found: warn
