name: M2h2 Structural Qualification

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2h2-structural-qualification-${{ github.ref }}
  # Supersede obsolete-source runs explicitly; report-only pushes preserve active qualification.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[m2h2-supersede-qualification]') || contains(github.event.head_commit.message, '[m2h2-structural-qualification]') }}

jobs:
  final-interactions:
    name: Measured I3 alternatives five fresh builds
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[m2h2-structural-qualification]')
    runs-on: self-hosted
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Require exact pinned KiCad 10.0.6 before qualification
        run: python tools/check_m2h2_locked_toolchain.py

      - name: Qualify missing measured I3 classes
        run: |
          set -uo pipefail
          export PYTHONPATH=src:tools
          root="fixtures/m2h2/structural_final_${GITHUB_SHA}"
          overall=0
          qualify() {
            case_name="$1"
            shift
            if ! python tools/run_m2h2_structural_alternative.py \
              --design "fixtures/m2h2/interaction/i3/$case_name.json" \
              --out "$root/$case_name" "$@"; then
              overall=1
            fi
          }
          qualify a0_multiple --bands 2 --minimum-bands
          qualify a0_interleaved --bands 2 --minimum-bands --interleaved
          qualify a1_multiple --bands 2 --minimum-bands
          qualify a1_interleaved --bands 2 --minimum-bands --interleaved
          qualify a3_one --bands 1
          qualify a2_one --bands 1
          qualify a2_interleaved --bands 2 --minimum-bands --interleaved
          qualify three_amplifier_one_band --bands 1 --core-bands
          qualify a3_interleaved --bands 2 --minimum-bands --interleaved
          exit "$overall"

      - name: Persist measured structural evidence on locked runner
        if: always()
        run: |
          root="$HOME/m2h2-evidence/${GITHUB_SHA}"
          mkdir -p "$root"
          rm -rf "$root/structural"
          cp -a "fixtures/m2h2/structural_final_${GITHUB_SHA}" "$root/structural"
          echo "m2h2_persistent_evidence_root=$root/structural"

      - name: Upload measured structural evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: m2h2-structural-qualification-${{ github.sha }}
          path: fixtures/m2h2/structural_final_${{ github.sha }}
          if-no-files-found: warn
