name: M2h2 Persisted Native Render Inventory

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact SHA of existing persisted qualification
        required: true
        type: string
      emit_case:
        description: Optional qualified case name for one native SVG transfer
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: m2h2-persisted-render-inventory
  cancel-in-progress: false

jobs:
  inventory:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[m2h2-render-inventory]')
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Verify and hash native KiCad renders from persisted qualification
        env:
          INPUT_SOURCE: ${{ inputs.source_sha }}
          INPUT_CASE: ${{ inputs.emit_case }}
          PUSH_SOURCE: ${{ github.event.before }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            source_sha="$INPUT_SOURCE"
          elif [[ "$PUSH_MESSAGE" =~ \[m2h2-audit-source:([0-9a-f]{40})\] ]]; then
            source_sha="${BASH_REMATCH[1]}"
          else
            source_sha="$PUSH_SOURCE"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          root="$HOME/m2h2-evidence/$source_sha"
          test -f "$root/qualification/results.json"
          test -f "$root/interactions/i1/results.json"
          test -f "$root/structural/a0_multiple/results.json"
          args=(--root "$root" --source-sha "$source_sha" --out "$root/audit/native_render_inventory_v2_$source_sha.json")
          if [[ -n "${INPUT_CASE:-}" ]]; then
            args+=(--emit-case "$INPUT_CASE")
          elif [[ "$PUSH_MESSAGE" == *"m2h2-render-case:"* ]]; then
            case_token="${PUSH_MESSAGE#*m2h2-render-case:}"
            case_token="${case_token%%]*}"
            [[ "$case_token" =~ ^[A-Za-z0-9_.-]+__[A-Za-z0-9_.-]+$ ]]
            args+=(--emit-case "$case_token")
          fi
          PYTHONPATH=src:tools python tools/audit_m2h2_persisted_native_renders.py "${args[@]}"
