name: M2h2 Development Composition Probe
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  composition-probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[m2h2-development-probe]')
    # This private repository's governed M2h2 evidence and KiCad tooling run on the locked runner.
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Inspect bounded composition of preserved regressions
        run: PYTHONPATH=src:tools python .github/scripts/m2h2_development_probe.py
