name: M2h2 Preserved Failure Inspection
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  failure-inspection:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[m2h2-failure-inspection]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m2h2-current-regressions-7ebfe8b3d10fb90532aa1e20277618b399886fb9
          path: evidence
          run-id: 37093175818
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read preserved ERC failure witnesses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          directory = Path("evidence/qualification_regressions/v6-8/run1.failed/reports")
          for name in ("failure.json", "erc.json", "electrical.json"):
              path = directory / name
              if path.is_file():
                  print(json.dumps({"kind": "m2h2.failure-inspection.1", "case": "v6-8", "report": name, "payload": json.loads(path.read_text())}, separators=(",", ":")), flush=True)
          PY
