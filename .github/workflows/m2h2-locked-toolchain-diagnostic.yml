name: M2h2 Locked Toolchain Diagnostic

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-toolchain-diagnostic:
    name: locked KiCad toolchain diagnostic
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report and validate locked KiCad toolchain identity
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import socket
          import subprocess
          import sys

          def digest(path: Path) -> str | None:
              if not path.is_file():
                  return None
              return hashlib.sha256(path.read_bytes()).hexdigest()

          cpu_model = next(
              (
                  line.split(':', 1)[1].strip()
                  for line in Path('/proc/cpuinfo').read_text().splitlines()
                  if line.startswith('model name')
              ),
              None,
          )
          lock = json.loads(Path('fixtures/m1a/toolchain.lock.json').read_text())
          platform_info = {
              'hostname': socket.gethostname(),
              'runner_name': os.environ.get('RUNNER_NAME'),
              'runner_os': os.environ.get('RUNNER_OS'),
              'runner_arch': os.environ.get('RUNNER_ARCH'),
              'os': platform.platform(),
              'architecture': platform.machine(),
              'cpu': platform.processor() or platform.machine(),
              'cpu_model': cpu_model,
          }
          mismatches = []
          if {k: platform_info[k] for k in ('os', 'architecture', 'cpu', 'cpu_model')} != lock['platform']:
              mismatches.append({'id': 'platform', 'expected': lock['platform'], 'actual': platform_info})
          for section in ('executables', 'libraries'):
              for item in lock[section]:
                  path = Path(item['path'])
                  actual = digest(path)
                  expected = item.get('file_sha256')
                  if not path.is_file() or actual != expected:
                      mismatches.append(
                          {
                              'section': section,
                              'id': item['id'],
                              'path': str(path),
                              'exists': path.is_file(),
                              'expected_sha256': expected,
                              'actual_sha256': actual,
                              'size': path.stat().st_size if path.exists() else None,
                              'mode': oct(path.stat().st_mode) if path.exists() else None,
                          }
                      )
          launcher = Path(lock['executables'][0]['path'])
          version_probe = None
          if launcher.is_file():
              probe = subprocess.run(
                  [str(launcher), 'kicad-cli', 'version'],
                  capture_output=True,
                  text=True,
                  timeout=30,
              )
              version_probe = {
                  'returncode': probe.returncode,
                  'stdout': probe.stdout.strip(),
                  'stderr': probe.stderr.strip(),
              }
              if probe.returncode != 0 or probe.stdout.strip() != '10.0.6':
                  mismatches.append({'id': 'version_probe', 'expected': '10.0.6', 'actual': version_probe})
          summary = {'platform': platform_info, 'version_probe': version_probe, 'mismatches': mismatches}
          print('LOCKED_KICAD_DIAGNOSTIC=' + json.dumps(summary, sort_keys=True))
          if mismatches:
              sys.exit('locked KiCad toolchain identity mismatch')
          PY
