name: M2h2 Structural Render Audit

on:
  workflow_run:
    workflows: [M2h2 Structural Qualification]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      source_head:
        description: Exact qualified source head
        required: true
      run_id:
        description: Completed structural qualification run
        required: true

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QUALIFICATION_HEAD: ${{ github.event.workflow_run.head_sha || inputs.source_head }}
      QUALIFICATION_RUN: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFICATION_HEAD }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: m2h2-structural-qualification-${{ env.QUALIFICATION_HEAD }}
          path: fixtures/m2h2/structural_final_${{ env.QUALIFICATION_HEAD }}
          run-id: ${{ env.QUALIFICATION_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Transfer source-matched structural renders
        run: |
          PYTHONPATH=src:tools python - <<'PY'
          import json
          import os
          from pathlib import Path
          from run_m2h2_final_artifact_audit import identity_errors, render_chunks
          root = Path('fixtures/m2h2/structural_final_' + os.environ['QUALIFICATION_HEAD'])
          records = []
          for path in sorted(root.glob('*/results.json')):
              payload = json.loads(path.read_text())
              errors = identity_errors(payload)
              assert not errors, errors
              assert payload['accepted'] and payload['reproducible'] and len(payload['runs']) == 5
              record = {
                  'case': path.parent.name,
                  'required_class': payload['required_class'],
                  'placements': payload['runs'][0]['placements'],
                  'classes': [{key: run[key] for key in ('all_bands', 'active_core_bands', 'interleaved')}
                              for run in payload['runs']],
              }
              records.append(record)
              print(json.dumps({'kind': 'm2h2.structural-render-audit.1', **record}, separators=(',', ':')), flush=True)
              render_chunks(root, 'structural__' + path.parent.name, path.parent)
          required = {
              'a0_multiple', 'a0_interleaved', 'a1_multiple', 'a1_interleaved',
              'a2_one', 'a2_interleaved', 'three_amplifier_one_band', 'a3_interleaved', 'a3_one',
          }
          assert len(records) == 9 and {record['case'] for record in records} == required
          PY
