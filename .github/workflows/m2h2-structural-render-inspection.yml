name: M2h2 Structural Render Audit

on:
  workflow_run:
    workflows: [M2h2 Structural Qualification]
    types: [completed]
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source_head:
        description: Exact qualified source SHA with persisted runner evidence
        required: true
        type: string
      run_id:
        description: Legacy qualification run identifier (persisted evidence is authoritative)
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[m2h2-structural-render-audit]')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Resolve exact qualified source
        id: evidence
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_HEAD: ${{ inputs.source_head }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            source_sha="$EVENT_HEAD"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            source_sha="$DISPATCH_HEAD"
          elif [[ "$PUSH_MESSAGE" =~ \[m2h2-audit-source:([0-9a-f]{40})\] ]]; then
            source_sha="${BASH_REMATCH[1]}"
          else
            echo "Push audit requires an explicit m2h2-audit-source SHA" >&2
            exit 1
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          test -f "$HOME/m2h2-evidence/$source_sha/structural/a0_multiple/results.json"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.evidence.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Transfer source-matched structural renders
        env:
          QUALIFICATION_HEAD: ${{ steps.evidence.outputs.source_sha }}
        run: |
          PYTHONPATH=src:tools python - <<'PY'
          import json
          import os
          from pathlib import Path
          from run_m2h2_final_artifact_audit import identity_errors, render_chunks
          sha = os.environ['QUALIFICATION_HEAD']
          root = Path.home() / 'm2h2-evidence' / sha / 'structural'
          records = []
          for path in sorted(root.glob('*/results.json')):
              payload = json.loads(path.read_text())
              errors = identity_errors(payload)
              assert not errors, errors
              assert payload['git_head'] == sha
              assert payload['accepted'] and payload['reproducible'] and len(payload['runs']) == 5
              record = {
                  'case': path.parent.name,
                  'required_class': payload['required_class'],
                  'placements': payload['runs'][0]['placements'],
                  'classes': [{key: run[key] for key in ('all_bands', 'active_core_bands', 'interleaved')}
                              for run in payload['runs']],
              }
              records.append(record)
              print(json.dumps({'kind': 'm2h2.structural-render-audit.1', **record}, separators=(',', ':')), flush=True)
              render_chunks(root, 'structural__' + path.parent.name, path.parent)
          required = {
              'a0_multiple', 'a0_interleaved', 'a1_multiple', 'a1_interleaved',
              'a2_one', 'a2_interleaved', 'three_amplifier_one_band', 'a3_interleaved', 'a3_one',
          }
          assert len(records) == 9 and {record['case'] for record in records} == required
          PY
