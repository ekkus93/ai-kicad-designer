name: M2h2 Fast Validation

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Only the newest master head can provide current-source baseline evidence.
# Cancel stale queued/running validations so the single locked self-hosted
# runner is not consumed by obsolete commits after rapid CAS updates.
concurrency:
  group: m2h2-fast-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: static lint / format / diff-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff lint
        run: python -m ruff check src/ai_kicad tests tools

      - name: Ruff format check m2_compose
        run: python -m ruff format --check src/ai_kicad/m2_compose.py

      - name: Ruff format check src remainder
        run: |
          python -m ruff format --check \
            $(find src/ai_kicad -name '*.py' ! -path 'src/ai_kicad/m2_compose.py' | sort)

      - name: Ruff format check test_m2h2_repair_matrix
        run: python -m ruff format --check tests/test_m2h2_repair_matrix.py

      - name: Contracts format diff lines 1-200
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '1'
          RANGE_HI: '200'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 201-400
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '201'
          RANGE_HI: '400'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 401-600
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '401'
          RANGE_HI: '600'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 601-625
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '601'
          RANGE_HI: '625'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 626-650
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '626'
          RANGE_HI: '650'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 651-675
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '651'
          RANGE_HI: '675'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 676-700
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '676'
          RANGE_HI: '700'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 701-800
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '701'
          RANGE_HI: '800'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 801-900
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '801'
          RANGE_HI: '900'
        run: python .github/scripts/check_format_range.py

      - name: Ruff format check key M2 tests
        run: |
          python -m ruff format --check \
            tests/test_m2g2.py \
            tests/test_m2d1.py \
            tests/test_m2a.py \
            tests/test_m2b.py

      - name: Ruff format check remaining tests
        run: |
          python -m ruff format --check \
            $(find tests -name '*.py' \
              ! -path 'tests/test_m2h2_repair_matrix.py' \
              ! -path 'tests/test_m2h2_contracts.py' \
              ! -path 'tests/test_m2g2.py' \
              ! -path 'tests/test_m2d1.py' \
              ! -path 'tests/test_m2a.py' \
              ! -path 'tests/test_m2b.py' | sort)

      - name: Ruff format check tools
        run: python -m ruff format --diff --check tools

      - name: Git diff check
        run: git diff --check

      - name: Scoped trailing-whitespace check
        run: |
          if git grep -nI -E '[[:blank:]]$' -- \
            src/ai_kicad \
            tests \
            tools \
            .github/workflows/m2h2-fast-validation.yml \
            docs/M2H2_FINALIZATION_TODO_2026-09-27.md \
            fixtures/m2h2/STATUS.md; then
            exit 1
          fi

  hosted-contract-validation:
    name: M2h2 contract pytest on hosted runner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: M2h2 contract pytest
        run: >-
          python -m pytest -q
          tests/test_m2h2_contracts.py
          tests/test_m2h2_repair_matrix.py
          tests/test_m2h2_interaction_runner.py

      - name: Git diff check
        run: git diff --check

  locked-runner-validation:
    name: pytest on locked runner
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Pytest
        run: python -m pytest -q

      - name: Git diff check
        run: git diff --check
