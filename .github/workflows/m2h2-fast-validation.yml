name: M2h2 Fast Validation

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-validation:
    name: pytest / ruff / diff-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff lint
        run: python -m ruff check src/ai_kicad tests tools

      - name: Ruff format check
        run: python -m ruff format --check src/ai_kicad tests tools

      - name: Pytest
        run: python -m pytest -q

      - name: Git diff check
        run: git diff --check
