name: M2h2 Fast Validation

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: static lint / format / diff-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff lint
        run: python -m ruff check src/ai_kicad tests tools

      - name: Ruff format check m2_compose
        run: python -m ruff format --check src/ai_kicad/m2_compose.py

      - name: Ruff format check src remainder
        run: |
          python -m ruff format --check \
            $(find src/ai_kicad -name '*.py' ! -path 'src/ai_kicad/m2_compose.py' | sort)

      - name: Repair matrix format diff lines 1-80
        run: |
          cp tests/test_m2h2_repair_matrix.py /tmp/repair_matrix_orig.py
          cp tests/test_m2h2_repair_matrix.py /tmp/repair_matrix_fmt.py
          python -m ruff format --config pyproject.toml /tmp/repair_matrix_fmt.py
          python - <<'PY'
          import difflib
          from pathlib import Path
          lo, hi = 1, 80
          orig = Path('/tmp/repair_matrix_orig.py').read_text().splitlines()
          fmt = Path('/tmp/repair_matrix_fmt.py').read_text().splitlines()
          for tag, i1, i2, _j1, _j2 in difflib.SequenceMatcher(a=orig, b=fmt).get_opcodes():
              if tag != 'equal' and i1 < hi and i2 >= lo - 1:
                  raise SystemExit(1)
          PY

      - name: Repair matrix format diff lines 81-160
        run: |
          cp tests/test_m2h2_repair_matrix.py /tmp/repair_matrix_orig.py
          cp tests/test_m2h2_repair_matrix.py /tmp/repair_matrix_fmt.py
          python -m ruff format --config pyproject.toml /tmp/repair_matrix_fmt.py
          python - <<'PY'
          import difflib
          from pathlib import Path
          lo, hi = 81, 160
          orig = Path('/tmp/repair_matrix_orig.py').read_text().splitlines()
          fmt = Path('/tmp/repair_matrix_fmt.py').read_text().splitlines()
          for tag, i1, i2, _j1, _j2 in difflib.SequenceMatcher(a=orig, b=fmt).get_opcodes():
              if tag != 'equal' and i1 < hi and i2 >= lo - 1:
                  raise SystemExit(1)
          PY

      - name: Repair matrix format diff lines 161-240
        run: |
          cp tests/test_m2h2_repair_matrix.py /tmp/repair_matrix_orig.py
          cp tests/test_m2h2_repair_matrix.py /tmp/repair_matrix_fmt.py
          python -m ruff format --config pyproject.toml /tmp/repair_matrix_fmt.py
          python - <<'PY'
          import difflib
          from pathlib import Path
          lo, hi = 161, 240
          orig = Path('/tmp/repair_matrix_orig.py').read_text().splitlines()
          fmt = Path('/tmp/repair_matrix_fmt.py').read_text().splitlines()
          for tag, i1, i2, _j1, _j2 in difflib.SequenceMatcher(a=orig, b=fmt).get_opcodes():
              if tag != 'equal' and i1 < hi and i2 >= lo - 1:
                  raise SystemExit(1)
          PY

      - name: Repair matrix format diff lines 241-320
        run: |
          cp tests/test_m2h2_repair_matrix.py /tmp/repair_matrix_orig.py
          cp tests/test_m2h2_repair_matrix.py /tmp/repair_matrix_fmt.py
          python -m ruff format --config pyproject.toml /tmp/repair_matrix_fmt.py
          python - <<'PY'
          import difflib
          from pathlib import Path
          lo, hi = 241, 320
          orig = Path('/tmp/repair_matrix_orig.py').read_text().splitlines()
          fmt = Path('/tmp/repair_matrix_fmt.py').read_text().splitlines()
          for tag, i1, i2, _j1, _j2 in difflib.SequenceMatcher(a=orig, b=fmt).get_opcodes():
              if tag != 'equal' and i1 < hi and i2 >= lo - 1:
                  raise SystemExit(1)
          PY

      - name: Repair matrix format diff lines 321-460
        run: |
          cp tests/test_m2h2_repair_matrix.py /tmp/repair_matrix_orig.py
          cp tests/test_m2h2_repair_matrix.py /tmp/repair_matrix_fmt.py
          python -m ruff format --config pyproject.toml /tmp/repair_matrix_fmt.py
          python - <<'PY'
          import difflib
          from pathlib import Path
          lo, hi = 321, 460
          orig = Path('/tmp/repair_matrix_orig.py').read_text().splitlines()
          fmt = Path('/tmp/repair_matrix_fmt.py').read_text().splitlines()
          for tag, i1, i2, _j1, _j2 in difflib.SequenceMatcher(a=orig, b=fmt).get_opcodes():
              if tag != 'equal' and i1 < hi and i2 >= lo - 1:
                  raise SystemExit(1)
          PY

      - name: Ruff format check test_m2h2_contracts
        run: python -m ruff format --check tests/test_m2h2_contracts.py

      - name: Ruff format check key M2 tests
        run: |
          python -m ruff format --check \
            tests/test_m2g2.py \
            tests/test_m2d1.py \
            tests/test_m2a.py \
            tests/test_m2b.py

      - name: Ruff format check remaining tests
        run: |
          python -m ruff format --check \
            $(find tests -name '*.py' \
              ! -path 'tests/test_m2h2_repair_matrix.py' \
              ! -path 'tests/test_m2h2_contracts.py' \
              ! -path 'tests/test_m2g2.py' \
              ! -path 'tests/test_m2d1.py' \
              ! -path 'tests/test_m2a.py' \
              ! -path 'tests/test_m2b.py' | sort)

      - name: Ruff format check tools
        run: python -m ruff format --check tools

      - name: Git diff check
        run: git diff --check

      - name: Scoped trailing-whitespace check
        run: |
          if git grep -nI -E '[[:blank:]]$' -- \
            src/ai_kicad \
            tests \
            tools \
            .github/workflows/m2h2-fast-validation.yml \
            docs/M2H2_FINALIZATION_TODO_2026-09-27.md \
            fixtures/m2h2/STATUS.md; then
            exit 1
          fi

  locked-runner-validation:
    name: pytest on locked runner
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Pytest
        run: python -m pytest -q

      - name: Git diff check
        run: git diff --check
