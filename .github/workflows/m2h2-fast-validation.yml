name: M2h2 Fast Validation

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Only the newest master head can provide current-source baseline evidence.
# Cancel stale queued/running validations so the single locked self-hosted
# runner is not consumed by obsolete commits after rapid CAS updates.
concurrency:
  group: m2h2-fast-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: static lint / format / diff-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff lint
        run: python -m ruff check src/ai_kicad tests tools

      - name: Structural anti-overfitting audit
        run: python tools/run_m2h2_structural_audit.py

      - name: Ruff format check m2_compose
        run: python -m ruff format --check src/ai_kicad/m2_compose.py

      - name: Ruff format check src remainder
        run: |
          python -m ruff format --diff --check \
            $(find src/ai_kicad -name '*.py' ! -path 'src/ai_kicad/m2_compose.py' | sort)

      - name: Ruff format check test_m2h2_repair_matrix
        run: python -m ruff format --check tests/test_m2h2_repair_matrix.py

      - name: Contracts format diff lines 1-200
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '1'
          RANGE_HI: '200'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 201-400
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '201'
          RANGE_HI: '400'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 401-600
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '401'
          RANGE_HI: '600'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 601-625
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '601'
          RANGE_HI: '625'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 626-650
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '626'
          RANGE_HI: '650'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 651-675
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '651'
          RANGE_HI: '675'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 676-700
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '676'
          RANGE_HI: '700'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 701-800
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '701'
          RANGE_HI: '800'
        run: python .github/scripts/check_format_range.py

      - name: Contracts format diff lines 801-900
        env:
          FORMAT_PATH: tests/test_m2h2_contracts.py
          RANGE_LO: '801'
          RANGE_HI: '900'
        run: python .github/scripts/check_format_range.py

      - name: Ruff format check key M2 tests
        run: |
          python -m ruff format --check \
            tests/test_m2g2.py \
            tests/test_m2d1.py \
            tests/test_m2a.py \
            tests/test_m2b.py

      - name: Ruff format check remaining tests
        run: |
          python -m ruff format --diff --check \
            $(find tests -name '*.py' \
              ! -path 'tests/test_m2h2_repair_matrix.py' \
              ! -path 'tests/test_m2h2_contracts.py' \
              ! -path 'tests/test_m2g2.py' \
              ! -path 'tests/test_m2d1.py' \
              ! -path 'tests/test_m2a.py' \
              ! -path 'tests/test_m2b.py' | sort)

      - name: Ruff format check tools
        run: python -m ruff format --diff --check tools

      - name: Git diff check
        run: git diff --check

      - name: Scoped trailing-whitespace check
        run: |
          if git grep -nI -E '[[:blank:]]$' -- \
            src/ai_kicad \
            tests \
            tools \
            .github/workflows/m2h2-fast-validation.yml \
            docs/M2H2_FINALIZATION_TODO_2026-09-27.md \
            fixtures/m2h2/STATUS.md; then
            exit 1
          fi

  hosted-contract-validation:
    name: M2h2 contract pytest on hosted runner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: M2h2 contract pytest
        run: >-
          python -m pytest -q
          tests/test_m2h2_contracts.py
          tests/test_m2h2_repair_matrix.py
          tests/test_m2h2_interaction_runner.py
          tests/test_m2h2_structural_audit.py
          tests/test_m2_composition_candidate_rank.py
          tests/test_m2_composition_qualification_observation.py
          tests/test_m2_repeated_composition_observer.py
          tests/test_m2_repeated_structure_composition_observer.py
          tests/test_m2_routing_composition_observer.py
          tests/test_m2_branch_fanout_repack.py

      - name: Git diff check
        run: git diff --check

  locked-runner-validation:
    name: pytest and M2h2 one-run regressions on locked runner
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Report locked KiCad toolchain identity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import platform
          import subprocess

          def digest(path: Path) -> str | None:
              if not path.is_file():
                  return None
              return hashlib.sha256(path.read_bytes()).hexdigest()

          cpu_model = next(
              (
                  line.split(':', 1)[1].strip()
                  for line in Path('/proc/cpuinfo').read_text().splitlines()
                  if line.startswith('model name')
              ),
              None,
          )
          lock = json.loads(Path('fixtures/m1a/toolchain.lock.json').read_text())
          report = {
              'platform': {
                  'os': platform.platform(),
                  'architecture': platform.machine(),
                  'cpu': platform.processor() or platform.machine(),
                  'cpu_model': cpu_model,
              },
              'executables': [],
              'libraries': [],
          }
          for section in ('executables', 'libraries'):
              for item in lock[section]:
                  path = Path(item['path'])
                  report[section].append(
                      {
                          'id': item['id'],
                          'path': str(path),
                          'exists': path.is_file(),
                          'expected_sha256': item.get('file_sha256'),
                          'actual_sha256': digest(path),
                          'version': item.get('version'),
                      }
                  )
          launcher = Path(lock['executables'][0]['path'])
          if launcher.is_file():
              probe = subprocess.run(
                  [str(launcher), 'kicad-cli', 'version'],
                  capture_output=True,
                  text=True,
                  timeout=30,
              )
              report['version_probe'] = {
                  'returncode': probe.returncode,
                  'stdout': probe.stdout.strip(),
                  'stderr': probe.stderr.strip(),
              }
          print(json.dumps(report, indent=2, sort_keys=True))
          mismatches = [
              item['id']
              for section in ('executables', 'libraries')
              for item in report[section]
              if not item['exists'] or item['actual_sha256'] != item['expected_sha256']
          ]
          if report['platform'] != lock['platform']:
              mismatches.append('platform')
          version = report.get('version_probe')
          if not version or version['returncode'] != 0 or version['stdout'] != '10.0.6':
              mismatches.append('version_probe')
          if mismatches:
              raise SystemExit('LOCKED_KICAD_TOOLCHAIN_MISMATCH: ' + ', '.join(mismatches))
          PY

      - name: Pytest
        run: python -m pytest -q

      - name: M2h2 current-source V6-3 and DP2 regressions
        run: >-
          python tools/run_m2h2_current_regressions.py
          --out fixtures/m2h2/development_checks/ci_current_regressions_${{ github.sha }}

      - name: M2h2 connector-label and selected-triple five-run regressions
        run: |
          export PYTHONPATH=src:tools
          root="fixtures/m2h2/development_checks/ci_current_regressions_${GITHUB_SHA}/connector_labels"
          python tools/run_m2h2_i1.py --group i3 --only three_amplifier_one_band --out "$root/three_amplifier"
          python tools/run_m2h2_i1.py --group i5 --only c2_s3plus --out "$root/two_consumers"
          python tools/run_m2h2_i1.py --group i5 --only c3_s1_2 --out "$root/three_consumers"
          python tools/run_m2h2_i1.py --group i3 --only selected_triple --out "$root/tall_core_package_long_text"

      - name: M2h2 actual whole-band five-run regression
        run: |
          PYTHONPATH=src:tools python tools/run_m2h2_structural_alternative.py \
            --design fixtures/m2h2/interaction/i3/a3_one.json \
            --out fixtures/m2h2/development_checks/ci_current_regressions_${{ github.sha }}/whole_band/a3_one \
            --bands 1

      - name: M2h2 fresh-qualification regression builds
        env:
          PYTHONPATH: src:tools
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from run_m2g2_qualification import _build, _signature, _erc_violations
          cases = {
              "v5-3": "fixtures/m2blind_v5/ir/V5-3.json",
              "v6-5": "fixtures/m2blind_v6/ir/V6-5.json",
              "v6-6": "fixtures/m2blind_v6/ir/V6-6.json",
              "v6-8": "fixtures/m2blind_v6/ir/V6-8.json",
              "dp4": "fixtures/m2h2/development/dp4.json",
              "two_signal_chains_shared_rail": "fixtures/m2f2/ir/two_signal_chains_shared_rail.json",
          }
          root = Path("fixtures/m2h2/development_checks") / ("ci_current_regressions_" + os.environ["GITHUB_SHA"]) / "qualification_regressions"
          results = []
          for case, relative in cases.items():
              destination = root / case / "run1"
              rc = _build(Path(relative).resolve(), destination.resolve())
              record = {"case": case, "returncode": rc, "path": str(destination)}
              if rc == 0:
                  signature = _signature(destination)
                  record["accepted"] = (
                      signature["electrical"]["status"] == "pass"
                      and not signature["electrical"]["diagnostics"]
                      and _erc_violations(signature["erc"]) == 0
                      and signature["composition"]["obligation_certificate"]["serialized_scene_verified"] == "pass"
                  )
                  record["layout"] = signature["layout"]
              else:
                  record["accepted"] = False
              results.append(record)
              print(json.dumps({key: value for key, value in record.items() if key != "layout"}), flush=True)
          root.mkdir(parents=True, exist_ok=True)
          (root / "results.json").write_text(json.dumps({"git_head": os.environ["GITHUB_SHA"], "kind": "one_run_regressions_not_final_qualification", "results": results}, indent=2) + "\n")
          if not all(record["accepted"] for record in results):
              raise SystemExit(1)
          PY

      - name: Upload M2h2 current-source regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2h2-current-regressions-${{ github.sha }}
          path: fixtures/m2h2/development_checks/ci_current_regressions_${{ github.sha }}
          if-no-files-found: warn

      - name: Git diff check
        run: git diff --check
