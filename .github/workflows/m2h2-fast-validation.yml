name: M2h2 Fast Validation

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: static lint / diff-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff lint
        run: python -m ruff check src/ai_kicad tests tools

      - name: Git diff check
        run: git diff --check

      - name: Scoped trailing-whitespace check
        run: |
          if git grep -nI -E '[[:blank:]]$' -- \
            src/ai_kicad \
            tests \
            tools \
            .github/workflows/m2h2-fast-validation.yml \
            docs/M2H2_FINALIZATION_TODO_2026-09-27.md \
            fixtures/m2h2/STATUS.md; then
            exit 1
          fi

  locked-runner-validation:
    name: pytest / format on locked runner
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Pytest
        run: python -m pytest -q

      - name: Ruff format check m2_compose
        run: python -m ruff format --check src/ai_kicad/m2_compose.py

      - name: Ruff format check src remainder
        run: |
          python -m ruff format --check \
            $(find src/ai_kicad -name '*.py' ! -path 'src/ai_kicad/m2_compose.py' | sort)

      - name: Ruff format check tests
        run: python -m ruff format --check tests

      - name: Ruff format check tools
        run: python -m ruff format --check tools

      - name: Git diff check
        run: git diff --check
