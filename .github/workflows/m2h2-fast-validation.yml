name: M2h2 Fast Validation

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: static lint / format / diff-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff lint
        run: python -m ruff check src/ai_kicad tests tools

      - name: Ruff format check m2_compose
        run: python -m ruff format --check src/ai_kicad/m2_compose.py

      - name: Ruff format check src remainder
        run: |
          python -m ruff format --check \
            $(find src/ai_kicad -name '*.py' ! -path 'src/ai_kicad/m2_compose.py' | sort)

      - name: Repair matrix format diff lines 150-160
        env:
          RANGE_LO: '150'
          RANGE_HI: '160'
        run: python .github/scripts/check_repair_matrix_format_range.py

      - name: Repair matrix format diff lines 161-165
        env:
          RANGE_LO: '161'
          RANGE_HI: '165'
        run: python .github/scripts/check_repair_matrix_format_range.py

      - name: Repair matrix format diff lines 166-170
        env:
          RANGE_LO: '166'
          RANGE_HI: '170'
        run: python .github/scripts/check_repair_matrix_format_range.py

      - name: Repair matrix format diff lines 171-175
        env:
          RANGE_LO: '171'
          RANGE_HI: '175'
        run: python .github/scripts/check_repair_matrix_format_range.py

      - name: Repair matrix format diff lines 176-180
        env:
          RANGE_LO: '176'
          RANGE_HI: '180'
        run: python .github/scripts/check_repair_matrix_format_range.py

      - name: Repair matrix format diff lines 181-240
        env:
          RANGE_LO: '181'
          RANGE_HI: '240'
        run: python .github/scripts/check_repair_matrix_format_range.py

      - name: Repair matrix format diff lines 241-320
        env:
          RANGE_LO: '241'
          RANGE_HI: '320'
        run: python .github/scripts/check_repair_matrix_format_range.py

      - name: Repair matrix format diff lines 321-460
        env:
          RANGE_LO: '321'
          RANGE_HI: '460'
        run: python .github/scripts/check_repair_matrix_format_range.py

      - name: Ruff format check test_m2h2_contracts
        run: python -m ruff format --check tests/test_m2h2_contracts.py

      - name: Ruff format check key M2 tests
        run: |
          python -m ruff format --check \
            tests/test_m2g2.py \
            tests/test_m2d1.py \
            tests/test_m2a.py \
            tests/test_m2b.py

      - name: Ruff format check remaining tests
        run: |
          python -m ruff format --check \
            $(find tests -name '*.py' \
              ! -path 'tests/test_m2h2_repair_matrix.py' \
              ! -path 'tests/test_m2h2_contracts.py' \
              ! -path 'tests/test_m2g2.py' \
              ! -path 'tests/test_m2d1.py' \
              ! -path 'tests/test_m2a.py' \
              ! -path 'tests/test_m2b.py' | sort)

      - name: Ruff format check tools
        run: python -m ruff format --check tools

      - name: Git diff check
        run: git diff --check

      - name: Scoped trailing-whitespace check
        run: |
          if git grep -nI -E '[[:blank:]]$' -- \
            src/ai_kicad \
            tests \
            tools \
            .github/workflows/m2h2-fast-validation.yml \
            docs/M2H2_FINALIZATION_TODO_2026-09-27.md \
            fixtures/m2h2/STATUS.md; then
            exit 1
          fi

  locked-runner-validation:
    name: pytest on locked runner
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Pytest
        run: python -m pytest -q

      - name: Git diff check
        run: git diff --check
