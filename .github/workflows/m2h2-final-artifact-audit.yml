name: M2h2 Final Artifact Audit

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      qualification_sha:
        description: Exact stabilized source SHA whose persisted evidence should be audited
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: m2h2-artifact-audit
  cancel-in-progress: false

jobs:
  artifact-audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[m2h2-artifact-audit]')
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Check out current source for provenance comparison
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Resolve exact persisted qualification root
        id: evidence
        env:
          DISPATCH_SHA: ${{ inputs.qualification_sha }}
          PUSH_PARENT_SHA: ${{ github.event.before }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${DISPATCH_SHA}" ]; then
            source_sha="${DISPATCH_SHA}"
          elif [[ "${PUSH_MESSAGE}" =~ \[m2h2-audit-source:([0-9a-f]{40})\] ]]; then
            source_sha="${BASH_REMATCH[1]}"
          else
            source_sha="${PUSH_PARENT_SHA}"
          fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          root="$HOME/m2h2-evidence/${source_sha}"
          test -f "$root/qualification/results.json"
          test -f "$root/interactions/i1/results.json"
          test -f "$root/structural/a0_multiple/results.json"
          mkdir -p "$root/audit"
          # Preserve every prior PASS/FAIL report, including repeated attempts.
          # Never overwrite a previous independently audited evidence artifact.
          report="$root/audit/artifact_audit_${source_sha}_run${GITHUB_RUN_ID}_attempt${GITHUB_RUN_ATTEMPT}.json"
          test ! -e "$report"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "root=${root}" >> "$GITHUB_OUTPUT"
          echo "report=${report}" >> "$GITHUB_OUTPUT"
          echo "m2h2_persistent_evidence_root=${root}"

      # The push-triggering master commit may contain newer routing/source files
      # than the already-qualified evidence root. Do not audit an older source
      # against the moving workflow-trigger checkout.
      - name: Check out exact persisted qualification source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.evidence.outputs.source_sha }}

      - name: Verify exact qualification source checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.evidence.outputs.source_sha }}
        run: |
          set -euo pipefail
          observed_sha="$(git rev-parse HEAD)"
          if [[ "$observed_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::Qualified checkout mismatch: expected $SOURCE_SHA, got $observed_sha"
            exit 1
          fi

      - name: Install exact qualification source
        run: python -m pip install -e '.[dev]'

      - name: Audit exact final evidence and report comparison diagnostics
        env:
          ROOT: ${{ steps.evidence.outputs.root }}
          SOURCE_SHA: ${{ steps.evidence.outputs.source_sha }}
          REPORT_PATH: ${{ steps.evidence.outputs.report }}
        run: |
          set -o pipefail
          PYTHONPATH=src:tools python tools/run_m2h2_final_artifact_audit.py \
            --qualification "$ROOT/qualification" \
            --interactions "$ROOT/interactions" \
            --structural "$ROOT/structural" \
            --out "$REPORT_PATH" |
            grep -E '"kind":"m2h2\.(baseline-comparison|baseline-regression-diagnostics|artifact-audit-outcome|artifact-case-audit|structural-case-audit)\.1"'

      - name: Upload artifact audit report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: m2h2-artifact-audit-${{ steps.evidence.outputs.source_sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.report }}
          if-no-files-found: warn
