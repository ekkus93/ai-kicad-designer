name: M2h2 Final Artifact Audit

on:
  workflow_run:
    workflows: ["M2h2 Final Qualification"]
    types: [completed]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: m2h2-artifact-audit
  cancel-in-progress: false

jobs:
  artifact-audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[m2h2-artifact-audit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current source for provenance comparison
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Download exact qualification evidence
        uses: actions/download-artifact@v4
        with:
          name: m2h2-final-qualification-4493c318b37ea73a3e487eddf659aa3c316222c4
          path: fixtures/m2h2/qualification_final_candidate_4493c318b37ea73a3e487eddf659aa3c316222c4
          run-id: 37066444590
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact interaction evidence
        uses: actions/download-artifact@v4
        with:
          name: m2h2-final-interactions-4493c318b37ea73a3e487eddf659aa3c316222c4
          path: fixtures/m2h2/interaction_final_4493c318b37ea73a3e487eddf659aa3c316222c4
          run-id: 37066444519
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact structural evidence
        uses: actions/download-artifact@v4
        with:
          name: m2h2-structural-qualification-beb50458a1ba3b35667534954d2f01e0f40152ba
          path: fixtures/m2h2/structural_final_beb50458a1ba3b35667534954d2f01e0f40152ba
          run-id: 37053544406
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit final source, structural evidence, and fresh renders
        run: |
          PYTHONPATH=src:tools python tools/run_m2h2_final_artifact_audit.py \
            --qualification fixtures/m2h2/qualification_final_candidate_4493c318b37ea73a3e487eddf659aa3c316222c4 \
            --interactions fixtures/m2h2/interaction_final_4493c318b37ea73a3e487eddf659aa3c316222c4 \
            --structural fixtures/m2h2/structural_final_beb50458a1ba3b35667534954d2f01e0f40152ba \
            --out fixtures/m2h2/finalization_checks/artifact_audit_4493c318b37ea73a3e487eddf659aa3c316222c4.json \
            --emit-renders

      - name: Upload artifact audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2h2-artifact-audit-${{ github.sha }}
          path: fixtures/m2h2/finalization_checks/artifact_audit_4493c318b37ea73a3e487eddf659aa3c316222c4.json
          if-no-files-found: warn
