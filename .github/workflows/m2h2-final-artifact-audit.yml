name: M2h2 Final Artifact Audit

on:
  workflow_run:
    workflows: ["M2h2 Final Qualification"]
    types: [completed]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: m2h2-artifact-audit
  cancel-in-progress: false

jobs:
  artifact-audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[m2h2-artifact-audit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current source for provenance comparison
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Download exact qualification evidence
        uses: actions/download-artifact@v4
        with:
          name: m2h2-final-qualification-5c7640a8d9a505a733f009f7a2c7cd1d6c2012b0
          path: fixtures/m2h2/qualification_final_candidate_5c7640a8d9a505a733f009f7a2c7cd1d6c2012b0
          run-id: 37125376461
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact interaction evidence
        uses: actions/download-artifact@v4
        with:
          name: m2h2-final-interactions-5c7640a8d9a505a733f009f7a2c7cd1d6c2012b0
          path: fixtures/m2h2/interaction_final_5c7640a8d9a505a733f009f7a2c7cd1d6c2012b0
          run-id: 37125376457
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact structural evidence
        uses: actions/download-artifact@v4
        with:
          name: m2h2-structural-qualification-5c7640a8d9a505a733f009f7a2c7cd1d6c2012b0
          path: fixtures/m2h2/structural_final_5c7640a8d9a505a733f009f7a2c7cd1d6c2012b0
          run-id: 37125376451
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit final source, structural evidence, and fresh renders
        run: |
          PYTHONPATH=src:tools python tools/run_m2h2_final_artifact_audit.py \
            --qualification fixtures/m2h2/qualification_final_candidate_5c7640a8d9a505a733f009f7a2c7cd1d6c2012b0 \
            --interactions fixtures/m2h2/interaction_final_5c7640a8d9a505a733f009f7a2c7cd1d6c2012b0 \
            --structural fixtures/m2h2/structural_final_5c7640a8d9a505a733f009f7a2c7cd1d6c2012b0 \
            --out fixtures/m2h2/finalization_checks/artifact_audit_5c7640a8d9a505a733f009f7a2c7cd1d6c2012b0.json \
            --emit-renders

      - name: Upload artifact audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2h2-artifact-audit-${{ github.sha }}
          path: fixtures/m2h2/finalization_checks/artifact_audit_5c7640a8d9a505a733f009f7a2c7cd1d6c2012b0.json
          if-no-files-found: warn
